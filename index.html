function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function goHome() {
  currentPage = "home";
  renderApp();
  window.scrollTo(0, 0);

function showTenses() {
  currentPage = "tenses";
  renderApp();
  window.scrollTo(0, 0);

function renderHome() {
  return `
    <section class="card">
      <h2>Welcome to English Tenses Learning Academy</h2>
      <p>Learn all 12 English tenses with structures, examples, quizzes and Urdu explanations.</p>
      <p class="urdu">تمام بارہ انگلش ٹینسز آسان اردو وضاحت اور مثالوں کے ساتھ سیکھیں۔</p>
      <div class="grid">
        <button onclick="showTenses()">English Tenses</button>
        <button onclick="showConditionals()">Conditional Sentences</button>
      </div>
    </section>
    <section class="card">
      <h3>Start Learning</h3>
      <p>Choose a topic from the buttons above, or begin with the first tense.</p>
      <button onclick="openTense(0)">Start Present Simple</button>
    </section>
  `;
}

function renderTenses() {
  const filtered = tenseData.map((t, i) => ({t, i})).filter(({t}) => {
    const all = [
      t.name, t.use, t.urdu, t.help, t.verb,
      t.forms.positive, t.forms.negative, t.forms.question,
      ...t.examples.flat()
    ].join(" ").toLowerCase();
    return all.includes(searchText);
  });

  return `
    <section class="card">
      <h2>Choose a Tense</h2>
      <label for="tenseSearch">Search tenses or example sentences</label>
      <input id="tenseSearch" type="search"
        placeholder="Search: Present Simple, playing..."
        value="${escapeHTML(searchText)}"
        oninput="updateTenseSearch(this.value)">
      <div class="grid">
        ${filtered.map(({t,i}) => `
          <button class="lesson-button" onclick="openTense(${i})">
            ${escapeHTML(t.name)}
          </button>
        `).join("")}
      </div>
      ${filtered.length ? "" : "<p>No matching tense found.</p>"}
    </section>
  `;
}

function updateTenseSearch(value) {
  const cursor = document.getElementById("tenseSearch");
  const start = cursor ? cursor.selectionStart : null;
  searchText = String(value || "").toLowerCase();
  renderApp();
  const next = document.getElementById("tenseSearch");
  if (next) {
    next.focus();
    if (start !== null) next.setSelectionRange(start, start);
  }
}

function examplesHTML(title, exampleIndex) {
  return `
    <section class="card">
      <h3>${escapeHTML(title)}</h3>
      <ol class="example-list">
        ${tenseData[selectedTenseIndex].examples.map(row =>
          `<li>${escapeHTML(row[exampleIndex])}</li>`
        ).join("")}
      </ol>
    </section>
  `;
}

function renderLesson() {
  const t = tenseData[selectedTenseIndex];
  if (!t) return `<section class="card"><p>Tense not found.</p></section>`;

  return `
    <section class="card">
      <button class="secondary" onclick="showTenses()">← All Tenses</button>
      <h2>${escapeHTML(t.name)}</h2>
      <h3>Definition / Use</h3>
      <p>${escapeHTML(t.use)}</p>
      <p class="urdu">${escapeHTML(t.urdu)}</p>
      <h3>Helping Verb</h3>
      <p>${escapeHTML(t.help)}</p>
      <h3>Verb Form</h3>
      <p>${escapeHTML(t.verb)}</p>
      <h3>Positive Structure</h3>
      <div class="formula">${escapeHTML(t.forms.positive)}</div>
      <h3>Negative Structure</h3>
      <div class="formula">${escapeHTML(t.forms.negative)}</div>
      <h3>Interrogative Structure</h3>
      <div class="formula">${escapeHTML(t.forms.question)}</div>
      <p class="notice">Remember: the exact structure may vary with the subject and sentence meaning.</p>
      <button onclick="startTenseQuiz()">Take 5-Question Quiz</button>
    </section>
    ${examplesHTML("Positive Examples", 0)}
    ${examplesHTML("Negative Examples", 1)}
    ${examplesHTML("Interrogative Examples", 2)}
    <section class="card grid">
      <button ${selectedTenseIndex === 0 ? "disabled" : ""}
        onclick="openTense(${selectedTenseIndex - 1})">← Previous Tense</button>
      <button ${selectedTenseIndex === 11 ? "disabled" : ""}
        onclick="openTense(${selectedTenseIndex + 1})">Next Tense →</button>
    </section>
  `;
}

function openTense(index) {
  if (!Number.isInteger(index) || index < 0 || index >= tenseData.length) {
    alert("Tense not found.");
    return;
  }
  selectedTenseIndex = index;
  currentPage = "lesson";
  renderApp();
  window.scrollTo(0, 0);
}

function identifySentence() {
  const input = document.getElementById("identifierInput");
  const result = document.getElementById("identifierResult");
  if (!input || !result) return;

  const s = input.value.trim().toLowerCase();
  if (!s) {
    result.textContent = "Please enter a sentence first.";
    return;
  }

  const patterns = [
    [/^(am|is|are)\s+\w+ing\b/, "Present Continuous (question pattern)"],
    [/\b(am|is|are)\s+\w+ing\b/, "Present Continuous"],
    [/\b(has|have)\s+been\s+\w+ing\b/, "Present Perfect Continuous"],
    [/\b(had)\s+been\s+\w+ing\b/, "Past Perfect Continuous"],
    [/\b(will)\s+have\s+been\s+\w+ing\b/, "Future Perfect Continuous"],
    [/\b(will)\s+have\s+\w+ed\b/, "Possible Future Perfect"],
    [/\b(will)\s+be\s+\w+ing\b/, "Future Continuous"],
    [/\b(will)\s+\w+\b/, "Possible Future Simple"],
    [/\b(had)\s+\w+ed\b/, "Possible Past Perfect"],
    [/\b(has|have)\s+\w+ed\b/, "Possible Present Perfect"],
    [/\b(was|were)\s+\w+ing\b/, "Past Continuous"],
    [/\b(do|does)\s+not\b|\b(don't|doesn't)\b/, "Possible Present Simple negative"],
    [/\b(did)\s+not\b|\bdidn't\b/, "Possible Past Simple negative"],
    [/\b(is|am|are)\b/, "Possible Present Simple or another present pattern"],
    [/\b(yesterday|last night|last week|ago)\b/, "Possible Past Simple (check the verb form)"]
  ];

  const found = patterns.find(([regex]) => regex.test(s));
  result.textContent = found
    ? "Possible tense: " + found[1] + ". Please check the sentence structure."
    : "This example does not match a supported pattern. This basic identifier cannot recognize every tense.";
}

function shuffleArray(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startTenseQuiz() {
  const t = tenseData[selectedTenseIndex];
  if (!t) return;

  const otherTenses = tenseData.filter((_, i) => i !== selectedTenseIndex);

  const bank = [
    {
      question: "Which tense is being studied?",
      correct: t.name,
      options: [t.name, ...shuffleArray(otherTenses).slice(0, 3).map(x => x.name)]
    },
    {
      question: "Which helping verb information belongs to this tense?",
      correct: t.help,
      options: [t.help, "Only did", "Only will", "Only has"]
    },
    {
      question: "Which is the positive structure?",
      correct: t.forms.positive,
      options: [
        t.forms.positive,
        t.forms.negative,
        t.forms.question,
        "Subject + did + verb-ing"
      ]
    },
    {
      question: "Which sentence form asks a question?",
      correct: "Interrogative",
      options: ["Positive", "Negative", "Interrogative", "Imperative"]
    },
    {
      question: "What should you check when choosing a verb form?",
      correct: "The tense structure and subject",
      options: [
        "The tense structure and subject",
        "Only the length of the sentence",
        "Always use verb + ing",
        "Always use V2"
      ]
    }
  ];

  quizQuestions = bank.map(q => {
    const options = shuffleArray([...new Set(q.options)]);
    return {
      question: q.question,
      options,
      answer: options.indexOf(q.correct)
    };
  });

  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  currentPage = "quiz";
  renderApp();
  window.scrollTo(0, 0);
}

function renderQuiz() {
  if (quizIndex >= quizQuestions.length) {
    currentPage = "quizResult";
    return renderQuizResult();
  }

  const q = quizQuestions[quizIndex];
  return `
    <section class="card">
      <button class="secondary" onclick="cancelQuiz()">Exit Quiz</button>
      <h2>${escapeHTML(tenseData[selectedTenseIndex].name)} Quiz</h2>
      <p>Question ${quizIndex + 1} of ${quizQuestions.length}</p>
      <h3>${escapeHTML(q.question)}</h3>
      <div class="grid">
        ${q.options.map((option, i) => `
          <button class="lesson-button"
            ${quizAnswered ? "disabled" : ""}
            onclick="submitQuizAnswer(${i})">
            ${escapeHTML(option)}
          </button>
        `).join("")}
      </div>
      ${quizAnswered ? `
        <p class="formula">
          ${q.chosen === q.answer
            ? "Correct! Well done."
            : "Correct answer: " + escapeHTML(q.options[q.answer])}
        </p>
        <button onclick="nextQuizQuestion()">
          ${quizIndex === quizQuestions.length - 1 ? "View Results" : "Next Question"}
        </button>
      ` : ""}
    </section>
  `;
}

function submitQuizAnswer(choice) {
  if (quizAnswered) return;

  const q = quizQuestions[quizIndex];
  if (!q || choice < 0 || choice >= q.options.length) return;

  q.chosen = choice;
  quizAnswered = true;

  if (choice === q.answer) {
    quizScore++;
  } else {
    mistakeReview.push({
      topic: tenseData[selectedTenseIndex].name,
      question: q.question,
      chosen: q.options[choice],
      correct: q.options[q.answer]
    });
  }

  renderApp();
}

function nextQuizQuestion() {
  if (!quizAnswered) {
    alert("Please select an answer first.");
    return;
  }

  quizIndex++;
  quizAnswered = false;

  if (quizIndex >= quizQuestions.length) {
    currentPage = "quizResult";
  }

  renderApp();
  window.scrollTo(0, 0);
}

function renderQuizResult() {
  const total = quizQuestions.length;
  const percentage = total ? Math.round((quizScore / total) * 100) : 0;

  let grade = "Need Improvement";
  if (quizScore === total) grade = "Excellent";
  else if (percentage >= 80) grade = "Very Good";
  else if (percentage >= 60) grade = "Good";
  else if (percentage >= 40) grade = "Keep Practising";

  return `
    <section class="card">
      <h2>Quiz Result</h2>
      <p>Score: <b>${quizScore} / ${total}</b></p>
      <p>Percentage: <b>${percentage}%</b></p>
      <p>Remarks: <b>${grade}</b></p>
      <button onclick="startTenseQuiz()">Try Again</button>
      <button class="secondary" onclick="openTense(${selectedTenseIndex})">Back to Lesson</button>
      <button class="secondary" onclick="showTenses()">All Tenses</button>
    </section>
  `;
}

  }

function buildGrandBank() {
  const bank = [];

  tenseData.forEach((t, index) => {
    const otherNames = shuffleArray(
      tenseData.filter(x => x.name !== t.name).map(x => x.name)
    ).slice(0, 3);

    const otherHelps = shuffleArray(
      tenseData.filter(x => x.name !== t.name).map(x => x.help)
    ).slice(0, 3);

    const otherVerbs = shuffleArray(
      tenseData.filter(x => x.name !== t.name).map(x => x.verb)
    ).slice(0, 3);

    bank.push({
      topic: t.name,
      question: "Which tense is described here? " + t.use,
      options: shuffleArray([t.name, ...otherNames]),
      correct: t.name
    });

    bank.push({
      topic: t.name,
      question: "Choose the correct positive structure for " + t.name + ".",
      options: shuffleArray([
        t.forms.positive,
        t.forms.negative,
        t.forms.question,
        tenseData[(index + 1) % tenseData.length].forms.positive
      ]),
      correct: t.forms.positive
    });

    bank.push({
      topic: t.name,
      question: "Which helping-verb information matches " + t.name + "?",
      options: shuffleArray([t.help, ...otherHelps]),
      correct: t.help
    });

    bank.push({
      topic: t.name,
      question: "Which verb-form information matches " + t.name + "?",
      options: shuffleArray([t.verb, ...otherVerbs]),
      correct: t.verb
    });

    bank.push({
      topic: t.name,
      question: "Choose a positive example of " + t.name + ".",
      options: shuffleArray([
        t.examples[0][0],
        t.examples[1][1],
        t.examples[2][2],
        tenseData[(index + 1) % tenseData.length].examples[0][0]
      ]),
      correct: t.examples[0][0]
    });

    bank.push({
      topic: t.name,
      question: "Which is the negative structure for " + t.name + "?",
      options: shuffleArray([
        t.forms.negative,
        t.forms.positive,
        t.forms.question,
        tenseData[(index + 1) % tenseData.length].forms.negative
      ]),
      correct: t.forms.negative
    });

    bank.push({
      topic: t.name,
      question: "Which is the interrogative structure for " + t.name + "?",
      options: shuffleArray([
        t.forms.question,
        t.forms.positive,
        t.forms.negative,
        tenseData[(index + 1) % tenseData.length].forms.question
      ]),
      correct: t.forms.question
    });

    bank.push({
      topic: t.name,
      question: "Which sentence is an example of " + t.name + "?",
      options: shuffleArray([
        t.examples[2][0],
        t.examples[0][1],
        t.examples[1][2],
        tenseData[(index + 1) % tenseData.length].examples[2][0]
      ]),
      correct: t.examples[2][0]
    });

    bank.push({
      topic: t.name,
      question: "Which sentence is negative in " + t.name + "?",
      options: shuffleArray([
        t.examples[0][1],
        t.examples[0][0],
        t.examples[0][2],
        tenseData[(index + 1) % tenseData.length].examples[0][1]
      ]),
      correct: t.examples[0][1]
    });

    bank.push({
      topic: t.name,
      question: "Which sentence is interrogative in " + t.name + "?",
      options: shuffleArray([
        t.examples[0][2],
        t.examples[0][0],
        t.examples[0][1],
        tenseData[(index + 1) % tenseData.length].examples[0][2]
      ]),
      correct: t.examples[0][2]
    });

    bank.push({
      topic: t.name,
      question: "Which Urdu explanation matches " + t.name + "?",
      options: shuffleArray([
        t.urdu,
        tenseData[(index + 1) % tenseData.length].urdu,
        tenseData[(index + 2) % tenseData.length].urdu,
        tenseData[(index + 3) % tenseData.length].urdu
      ]),
      correct: t.urdu
    });

    bank.push({
      topic: t.name,
      question: "Which tense has this helping-verb information: " + t.help + "?",
      options: shuffleArray([t.name, ...otherNames]),
      correct: t.name
    });
  });

  // Add six more questions to make a 150-question bank.
  for (let i = 0; i < 6; i++) {
    const t = tenseData[i];
    const otherNames = shuffleArray(
      tenseData.filter(x => x.name !== t.name).map(x => x.name)
    ).slice(0, 3);

    bank.push({
      topic: t.name,
      question: "Identify the tense from this sentence: " + t.examples[4][0],
      options: shuffleArray([t.name, ...otherNames]),
      correct: t.name
    });
  }

  return bank;
}

      <p>Test your knowledge of all 12 English tenses.</p>
      <ul>
        <li>25 multiple-choice questions per attempt.</li>
        <li>Questions are selected from a generated 150-question bank.</li>
        <li>Your score, percentage, grade and improvement topics appear at the end.</li>
      </ul>
      <p class="notice">When the test begins, learning pages are locked until you submit or exit the test.</p>
      <button onclick="beginGrandTest()">Start Grand Test</button>
    </section>
  `;
}

function renderGrandTest() {
  if (!grandQuestions.length) {
    return `<section class="card"><p>No questions loaded.</p><button onclick="showGrandTest()">Back</button></section>`;
  }

  const q = grandQuestions[grandIndex];

  return `
    <section class="card">
      <h2>Grand Test</h2>
      <p>Question ${grandIndex + 1} of ${grandQuestions.length}</p>
      <div class="formula">${escapeHTML(q.question)}</div>
      <div class="grid">
        ${q.options.map((option, i) => `
          <button class="lesson-button"
            ${grandAnswered ? "disabled" : ""}
            onclick="answerGrand(${i})">${escapeHTML(option)}</button>
        `).join("")}
      </div>
      ${grandAnswered ? `
        <p class="formula">
          ${q.chosen === q.answer
            ? "Correct!"
            : "Correct answer: " + escapeHTML(q.options[q.answer])}
        </p>
        <button onclick="nextGrandQuestion()">
          ${grandIndex === grandQuestions.length - 1 ? "Finish Test" : "Next Question"}
        </button>
      ` : ""}
      <button class="secondary" onclick="cancelGrandTest()">Exit Test</button>
    </section>
  `;
}

function answerGrand(choice) {
  if (grandAnswered) return;

  const q = grandQuestions[grandIndex];
  if (!q || choice < 0 || choice >= q.options.length) return;

  q.chosen = choice;
  grandAnswered = true;

  if (choice === q.answer) {
    grandScore++;
  } else {
    mistakeReview.push({
      topic: q.topic,
      question: q.question,
      chosen: q.options[choice],
      correct: q.options[q.answer]
    });
  }

  renderApp();
}

function nextGrandQuestion() {
  if (!grandAnswered) {
    alert("Choose an answer first.");
    return;
  }

  grandIndex++;
  grandAnswered = false;

  if (grandIndex >= grandQuestions.length) {
    currentPage = "grandResult";
    grandActive = false;
  }

  renderApp();
  window.scrollTo(0, 0);
}

function cancelGrandTest() {
  if (!confirm("Exit this test? Your current attempt will end.")) return;

  grandActive = false;
  grandQuestions = [];
  currentPage = "home";
  renderApp();
}

function renderGrandResult() {
  const total = grandQuestions.length;
  const percentage = total ? Math.round(grandScore / total * 100) : 0;
  let grade;

  if (grandScore >= 23) grade = "A+";
  else if (grandScore >= 21) grade = "A";
  else if (grandScore >= 16) grade = "B";
  else if (grandScore >= 12) grade = "C";
  else grade = "Fail / Need Improvement";

  const weak = {};
  grandQuestions.forEach(q => {
    if (q.chosen !== q.answer) {
      weak[q.topic] = (weak[q.topic] || 0) + 1;
    }
  });

  const weakList = Object.keys(weak);
  const reviewHTML = grandQuestions.map((q, i) => `
    <li>
      <b>${i + 1}. ${escapeHTML(q.question)}</b><br>
      Your answer: ${q.chosen === null ? "Not answered" : escapeHTML(q.options[q.chosen])}<br>
      Correct answer: ${escapeHTML(q.options[q.answer])}
    </li>
  `).join("");

  return `
    <section class="card">
      <h2>Grand Test Result</h2>
      <p>Score: <b>${grandScore} / ${total}</b></p>
      <p>Percentage: <b>${percentage}%</b></p>
      <p>Grade: <b>${grade}</b></p>
      <h3>Improvement Needed</h3>
      ${weakList.length
        ? `<ul>${weakList.map(name => `<li>${escapeHTML(name)}: ${weak[name]} mistake(s). Review this lesson.</li>`).join("")}</ul>`
        : "<p>Excellent! No incorrect answers.</p>"}
      <button onclick="beginGrandTest()">New Random Test</button>
      <button class="secondary" onclick="showTenses()">Review Lessons</button>
    </section>
    <section class="card">
      <h3>Answer Review</h3>
      <ol>${reviewHTML}</ol>
    </section>
  `;
}

/* ========== PART 7: TENSE WRITING TEST ========== */

let writingQuestions = [];
let writingAnswers = {};
let writingSubmitted = false;

function buildWritingBank() {
  const contexts = [
    "Write an example about school.",
    "Write an example about your family.",
    "Write an example about reading a book.",
    "Write an example about playing a game.",
    "Write an example about learning English.",
    "Write an example about doing homework.",
    "Write an example about helping someone.",
    "Write an example about travelling.",
    "Write an example about cooking food.",
    "Write an example about your daily routine.",
    "Write an example about a teacher.",
    "Write an example about a friend.",
    "Write an example about a rainy day."
  ];

  const bank = [];

  tenseData.forEach(t => {
    contexts.forEach(context => {
      bank.push({
        tense: t.name,
        prompt: "Write one original sentence in " + t.name + ". " + context
      });
    });
  });

  // 12 × 13 = 156 prompts; use exactly 150.
  return bank.slice(0, 150);
}

function showWritingTest() {
  currentPage = "writingIntro";
  writingSubmitted = false;
  renderApp();
  window.scrollTo(0, 0);
}

function beginWritingTest() {
  writingQuestions = shuffleArray(buildWritingBank()).slice(0, 15);
  writingAnswers = {};
  writingSubmitted = false;
  currentPage = "writingTest";
  renderApp();
  window.scrollTo(0, 0);
}

function renderWritingIntro() {
  return `
    <section class="card">
      <h2>Tense Writing Test</h2>
      <p>You will receive 15 prompts. Write one original sentence for each named tense.</p>
      <p>Prompts are selected from a 150-prompt bank.</p>
      <p class="urdu">ہر سوال میں دیے گئے ٹینس کے مطابق اپنا ایک جملہ لکھیں۔</p>
      <p class="notice">This basic offline test can check whether an answer is entered, but it cannot reliably judge every English sentence's grammar automatically. You should review your answers against the lesson examples.</p>
      <button onclick="beginWritingTest()">Start Writing Test</button>
    </section>
  `;
}

function renderWritingTest() {
  return `
    <section class="card">
      <h2>Tense Writing Test</h2>
      <p>Write one complete sentence for each prompt.</p>
      <p class="notice">Learning pages are locked while this test is open. Submit when finished.</p>
    </section>
    ${writingQuestions.map((q, i) => `
      <section class="card">
        <h3>Question ${i + 1}</h3>
        <p><b>Tense:</b> ${escapeHTML(q.tense)}</p>
        <p>${escapeHTML(q.prompt)}</p>
        <label for="writing${i}">Your sentence</label>
        <textarea id="writing${i}" rows="2"
          placeholder="Write your own sentence here..."
          oninput="saveWritingAnswer(${i}, this.value)">${escapeHTML(writingAnswers[i] || "")}</textarea>
      </section>
    `).join("")}
    <section class="card">
      <button onclick="submitWritingTest()">Submit Writing Test</button>
      <button class="secondary" onclick="cancelWritingTest()">Cancel Test</button>
    </section>
  `;
}

function saveWritingAnswer(index, value) {
  writingAnswers[index] = String(value || "");
}

function submitWritingTest() {
  if (!confirm("Submit your writing test now?")) return;

  writingSubmitted = true;
  currentPage = "writingResult";
  renderApp();
  window.scrollTo(0, 0);
}

function renderWritingResult() {
  const total = writingQuestions.length;
  const completed = writingQuestions.filter((q, i) =>
    String(writingAnswers[i] || "").trim().length > 0
  ).length;

  let grade;
  if (completed >= 14) grade = "A+";
  else if (completed >= 11) grade = "A";
  else if (completed >= 9) grade = "B";
  else if (completed >= 6) grade = "C";
  else if (completed === 5) grade = "D";
  else grade = "F";

  const percentage = total ? Math.round(completed / total * 100) : 0;

  return `
    <section class="card">
      <h2>Writing Test Submitted</h2>
      <p>Completed answers: <b>${completed} / ${total}</b></p>
      <p>Completion percentage: <b>${percentage}%</b></p>
      <p>Completion-based grade: <b>${grade}</b></p>
      <p class="notice">This grade counts filled answers only; it does not confirm grammatical correctness. Review each sentence carefully.</p>
      <button onclick="reviewWritingAnswers()">Review My Answers</button>
      <button class="secondary" onclick="beginWritingTest()">Try a New Test</button>
      <button class="secondary" onclick="goHome()">Home</button>
    </section>
  `;
}

function reviewWritingAnswers() {
  currentPage = "writingReview";
  renderApp();
}

function renderWritingReview() {
  return `
    <section class="card">
      <h2>Writing Answer Review</h2>
      ${writingQuestions.map((q, i) => `
        <div class="formula" style="margin:10px 0">
          <b>${i + 1}. ${escapeHTML(q.tense)}</b>
          <p>${escapeHTML(q.prompt)}</p>
          <p>Your answer: ${escapeHTML(writingAnswers[i] || "No answer entered.")}</p>
        </div>
      `).join("")}
      <button onclick="showTenses()">Review Lessons</button>
      <button class="secondary" onclick="goHome()">Home</button>
    </section>
  `;
}

function cancelWritingTest() {
  if (!confirm("Cancel this writing test? Your current answers will be discarded.")) return;

  writingAnswers = {};
  writingQuestions = [];
  writingSubmitted = false;
  currentPage = "home";
  renderApp();
}

/* ========== PART 8: MISTAKE REVIEW ========== */

function showMistakes() {
  currentPage = "mistakes";
  renderApp();
  window.scrollTo(0, 0);
}

function renderMistakes() {
  if (!mistakeReview.length) {
    return `
      <section class="card">
        <h2>Mistake Review</h2>
        <p>No recorded mistakes yet. Complete a quiz or test to collect mistakes here.</p>
        <button onclick="showTenses()">Practise Tenses</button>
        <button class="secondary" onclick="showGrandTest()">Grand Test</button>
      </section>
    `;
  }

  return `
    <section class="card">
      <h2>Mistake Review</h2>
      <p>Review the questions you answered incorrectly.</p>
      ${mistakeReview.map((m, i) => `
        <div class="formula" style="margin:12px 0">
          <b>${i + 1}. ${escapeHTML(m.topic)}</b>
          <p>${escapeHTML(m.question)}</p>
          <p>Your answer: ${escapeHTML(m.chosen)}</p>
          <p>Correct answer: <b>${escapeHTML(m.correct)}</b></p>
        </div>
      `).join("")}
      <button onclick="showGrandTest()">Practise Again</button>
      <button class="secondary" onclick="clearMistakes()">Clear Review</button>
    </section>
  `;
}

function clearMistakes() {
  if (!confirm("Clear all saved mistakes from this session?")) return;
  mistakeReview = [];
  renderApp();
}

/* Prevent navigation away from an active Grand Test or Writing Test. */
function enforceTestLock() {
  if (grandActive && currentPage !== "grandTest") {
    currentPage = "grandTest";
  }

  if (
    writingQuestions.length > 0 &&
    !writingSubmitted &&
    currentPage !== "writingTest"
  ) {
    currentPage = "writingTest";
  }
}

/* ========== PART 9: MAIN RENDERER ========== */

function renderApp() {
  if (!app) {
    console.error("Main app container was not found.");
    return;
  }

  enforceTestLock();

  let html = "";

  switch (currentPage) {
    case "home":
      html = renderHome();
      break;

    case "tenses":
      html = renderTenses();
      break;

    case "lesson":
      html = renderLesson();
      break;

    case "conditionals":
      html = renderConditionals();
      break;

case "conversionRules":
  html = renderConversionRules();
  break;
    case "identifier":
      html = renderIdentifier();
      break;

    case "quiz":
      html = renderQuiz();
      break;

    case "quizResult":
      html = renderQuizResult();
      break;

    case "grandIntro":
      html = renderGrandIntro();
      break;

    case "grandTest":
      html = renderGrandTest();
      break;

    case "grandResult":
      html = renderGrandResult();
      break;

    case "writingIntro":
      html = renderWritingIntro();
      break;

    case "writingTest":
      html = renderWritingTest();
      break;

    case "writingResult":
      html = renderWritingResult();
      break;

    case "writingReview":
      html = renderWritingReview();
      break;

    case "mistakes":
      html = renderMistakes();
      break;

    default:
      currentPage = "home";
      html = renderHome();j
  }

  app.innerHTML = html;
}

/* ========== PART 10: START WEBSITE ========== */

currentPage = "home";
searchText = "";
selectedTenseIndex = 0;

renderApp();

</script>
